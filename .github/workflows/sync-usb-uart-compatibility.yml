name: Sync USB-UART compatibility data

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/usb-uart-adapters.json'
      - 'docs/usb-uart-compatibility.json'
      - 'scripts/sync_usb_uart_compatibility.py'
      - '.github/workflows/sync-usb-uart-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usb-uart-compatibility-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate registry and generate pages and issue forms
        run: python scripts/sync_usb_uart_compatibility.py

      - name: Commit generated compatibility pages and forms
        run: |
          if git diff --quiet; then
            echo "Compatibility pages and forms are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/usb-uart-compatibility.html docs/usb-uart-compatibility-en.html .github/ISSUE_TEMPLATE/usb_uart_compatibility.yml .github/ISSUE_TEMPLATE/usb_uart_compatibility_en.yml
          git commit -m "Automate USB-UART compatibility pages and forms"
          git push
