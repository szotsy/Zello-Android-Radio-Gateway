name: Sync USB-UART compatibility data

on:
  push:
    branches: [main]
    paths:
      - 'docs/usb-uart-compatibility.json'
      - 'scripts/sync_usb_uart_compatibility.py'
      - 'scripts/process_release_usb_uart.py'
      - '.github/workflows/sync-usb-uart-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usb-uart-compatibility-sync
  cancel-in-progress: false

jobs:
  generate:
    # Release automation already regenerates its own outputs; skip its bot commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate registry and generate pages and issue forms
        run: python scripts/sync_usb_uart_compatibility.py

      - name: Refresh release-derived adapter list when a release exists
        run: |
          if [ -f docs/usb-uart-release.json ]; then
            python scripts/process_release_usb_uart.py
          fi

      - name: Commit generated compatibility pages, tested-device lists and issue forms
        run: |
          if git diff --quiet; then
            echo "Generated compatibility pages, tested-device lists and forms are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/usb-uart-adapters.json docs/usb-uart-compatibility.html docs/usb-uart-compatibility-en.html docs/index.html docs/index-en.html README.md README_HU.md .github/ISSUE_TEMPLATE/usb_uart_compatibility.yml .github/ISSUE_TEMPLATE/usb_uart_compatibility_en.yml
          git commit -m "Automate compatibility and tested-device documentation"
          git pull --rebase origin main
          git push
