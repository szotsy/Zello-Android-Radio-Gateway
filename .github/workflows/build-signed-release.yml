name: Build signed Android release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example: 1.10.67)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source=Orfeusz.Gateway_Source_v${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "apk=Orfeusz.Gateway_v${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 build tools
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Download source archive from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.release.outputs.source }}" \
            --dir source
          test -s "source/${{ steps.release.outputs.source }}"
          unzip -q "source/${{ steps.release.outputs.source }}" -d source/project
          WRAPPER="$(find source/project -type f -name gradlew -print -quit)"
          if [[ -z "$WRAPPER" ]]; then
            echo "::error::The source ZIP does not contain gradlew."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orfeusz-release.jks"
          test -s "$RUNNER_TEMP/orfeusz-release.jks"

      - name: Build unsigned Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Align, sign and verify APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unaligned*' -print -quit)"
          test -n "$UNSIGNED" || { echo "::error::Release APK was not produced."; exit 1; }
          BUILD_TOOLS="$ANDROID_HOME/build-tools/30.0.3"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/orfeusz-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk"
          sha256sum "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk" > "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk.sha256"

      - name: Upload signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk" \
            "$RUNNER_TEMP/Orfeusz.Gateway_v${{ steps.release.outputs.tag }}.apk.sha256" \
            --repo "${{ github.repository }}" --clobber
