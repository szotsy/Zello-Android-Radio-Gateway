name: Build signed Android release

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-signed-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example: 1.10.67)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_RELEASE_TAG"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source=Orfeusz.Gateway_Source_v${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "apk=Orfeusz.Gateway_v${TAG}.apk" >> "$GITHUB_OUTPUT"

      # The current Android SDK command-line tools require JDK 17.
      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu images already include Android command-line tools.
      # Avoid setup-android@v3: it requests the removed legacy "tools" package.
      - name: Accept Android SDK licenses and install build tools
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Download source archive from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.release.outputs.source }}" \
            --dir source
          test -s "source/${{ steps.release.outputs.source }}"
          unzip -q "source/${{ steps.release.outputs.source }}" -d source/project
          WRAPPER="$(find source/project -type f -name gradlew -print -quit)"
          if [[ -z "$WRAPPER" ]]; then
            echo "::error::The source ZIP does not contain gradlew."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          NOTES="source/project/RELEASE_NOTES_${{ steps.release.outputs.tag }}.txt"
          if [[ -s "$NOTES" ]]; then
            gh release edit "${{ steps.release.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --notes-file "$NOTES"
          else
            echo "::warning::Release notes file not found: $NOTES"
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orfeusz-release.jks"
          test -s "$RUNNER_TEMP/orfeusz-release.jks"

      # AGP 4.0.1 / Gradle 6.1.1 are built with the Java 8 toolchain.
      - name: Set up Java 8 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build unsigned Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Align, sign and verify APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unaligned*' -print -quit)"
          test -n "$UNSIGNED" || { echo "::error::Release APK was not produced."; exit 1; }
          BUILD_TOOLS="$ANDROID_HOME/build-tools/30.0.3"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/orfeusz-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/${{ steps.release.outputs.apk }}" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/${{ steps.release.outputs.apk }}"
          sha256sum "$RUNNER_TEMP/${{ steps.release.outputs.apk }}" > "$RUNNER_TEMP/${{ steps.release.outputs.apk }}.sha256"

      - name: Upload signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "$RUNNER_TEMP/${{ steps.release.outputs.apk }}" \
            "$RUNNER_TEMP/${{ steps.release.outputs.apk }}.sha256" \
            --repo "${{ github.repository }}" --clobber

      # Publish the stable alias only after the signed APK has passed apksigner verification.
      - name: Create and upload stable APK alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/${{ steps.release.outputs.apk }}" "$RUNNER_TEMP/Orfeusz.Gateway.apk"
          (cd "$RUNNER_TEMP" && sha256sum Orfeusz.Gateway.apk > Orfeusz.Gateway.apk.sha256)
          cmp --silent "$RUNNER_TEMP/${{ steps.release.outputs.apk }}" "$RUNNER_TEMP/Orfeusz.Gateway.apk"
          (cd "$RUNNER_TEMP" && sha256sum --check Orfeusz.Gateway.apk.sha256)
          gh release upload "${{ steps.release.outputs.tag }}" \
            "$RUNNER_TEMP/Orfeusz.Gateway.apk" \
            "$RUNNER_TEMP/Orfeusz.Gateway.apk.sha256" \
            --repo "${{ github.repository }}" --clobber
