name: Maintain latest APK download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the versioned APK (for example: 1.10.62)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-stable-apk-alias:
    # The /releases/latest/download URL must always point to a stable release,
    # not to a prerelease.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag and APK filename
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format (for example 1.10.62)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Orfeusz.Gateway_v${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Download versioned APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.release.outputs.apk }}" \
            --dir dist

      - name: Create and upload stable-name APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/${{ steps.release.outputs.apk }}" "dist/Orfeusz.Gateway.apk"
          gh release upload "${{ steps.release.outputs.tag }}" \
            "dist/Orfeusz.Gateway.apk" \
            --repo "${{ github.repository }}" \
            --clobber
