name: Maintain latest APK download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/latest-apk-alias.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the versioned APK (for example: 1.10.67)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-stable-apk-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag and APK filename
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_RELEASE_TAG"
          else
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Orfeusz.Gateway_v${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Download and validate versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.release.outputs.apk }}" \
            --dir dist
          APK="dist/${{ steps.release.outputs.apk }}"
          test -s "$APK" || { echo "::error::The versioned APK is missing or empty."; exit 1; }
          unzip -tq "$APK"
          cp "$APK" dist/Orfeusz.Gateway.apk
          (cd dist && sha256sum Orfeusz.Gateway.apk > Orfeusz.Gateway.apk.sha256)
          cmp --silent "$APK" dist/Orfeusz.Gateway.apk
          (cd dist && sha256sum --check Orfeusz.Gateway.apk.sha256)

      - name: Upload stable APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            dist/Orfeusz.Gateway.apk \
            dist/Orfeusz.Gateway.apk.sha256 \
            --repo "${{ github.repository }}" --clobber
