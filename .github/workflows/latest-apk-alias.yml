name: Maintain latest APK download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/latest-apk-alias.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the versioned APK (for example: 1.10.62)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-stable-apk-alias:
    # The /releases/latest/download URL must always point to a stable release,
    # not to a prerelease.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag and APK filename
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use MAJOR.MINOR.PATCH format (for example 1.10.62)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Orfeusz.Gateway_v${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Download and validate versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.release.outputs.apk }}" \
            --dir dist

          APK="dist/${{ steps.release.outputs.apk }}"
          if [[ ! -s "$APK" ]]; then
            echo "::error::The versioned APK is missing or empty."
            exit 1
          fi
          file "$APK"
          unzip -tq "$APK"
          cp "$APK" dist/Orfeusz.Gateway.apk
          (cd dist && sha256sum Orfeusz.Gateway.apk > Orfeusz.Gateway.apk.sha256)

      - name: Create and verify stable-name APK alias
        shell: bash
        run: |
          cmp --silent "dist/${{ steps.release.outputs.apk }}" dist/Orfeusz.Gateway.apk
          (cd dist && sha256sum --check Orfeusz.Gateway.apk.sha256)
          echo "Validated APK size: $(stat -c%s dist/Orfeusz.Gateway.apk) bytes"

      - name: Upload stable APK and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            dist/Orfeusz.Gateway.apk \
            dist/Orfeusz.Gateway.apk.sha256 \
            --repo "${{ github.repository }}" \
            --clobber
