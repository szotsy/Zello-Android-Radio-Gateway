name: Update USB-UART list from published Release

on:
  # Run only after the signed-release workflow has finished uploading the APK.
  # The release:published event races the APK build and was the cause of the
  # recurring "no APK asset" failures.
  workflow_run:
    workflows: ["Build signed Android release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to process (for example 1.10.85)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: usb-uart-release-sync
  cancel-in-progress: false

jobs:
  update-compatibility:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            TAG="$BUILD_BRANCH"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Could not resolve a valid release tag (got: $TAG)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Regenerate central-registry outputs
        run: python scripts/sync_usb_uart_compatibility.py

      - name: Read adapter manifest from the published APK
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/process_release_usb_uart.py

      - name: Regenerate outputs with newly discovered enabled adapters
        run: python scripts/sync_usb_uart_compatibility.py

      - name: Commit release-derived compatibility data
        run: |
          if git diff --quiet; then
            echo "Release compatibility data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/usb-uart-compatibility.json docs/usb-uart-release.json docs/usb-uart-compatibility.html docs/usb-uart-compatibility-en.html app/src/main/assets/usb-uart-adapters.json docs/index.html docs/index-en.html README.md README_HU.md .github/ISSUE_TEMPLATE/usb_uart_compatibility.yml .github/ISSUE_TEMPLATE/usb_uart_compatibility_en.yml
          git commit -m "Update USB-UART compatibility from published release"
          git pull --rebase origin main
          git push
