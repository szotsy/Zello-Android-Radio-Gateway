name: "Request USB–UART adapter evaluation / engine integration"
description: "Request evaluation of an adapter you own and possible integration into the Orfeusz Gateway engine."
title: "[ADAPTER REQUEST] "
labels: ["usb-uart", "adapter-request"]
body:
  - type: markdown
    attributes:
      value: "Use this form to request support for another adapter. Submission does not guarantee support or compatibility. The maintainer will first review the model, USB identifiers and CTS/RTS capabilities."
  - type: input
    id: manufacturer
    attributes:
      label: "Manufacturer"
      placeholder: "FTDI, Silicon Labs, WCH, Prolific..."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Exact adapter / chip model"
      placeholder: "FT232H, CP2102N, CH340C..."
    validations:
      required: true
  - type: input
    id: vid_pid
    attributes:
      label: "USB VID / PID (if known)"
      placeholder: "0403:6014"
    validations:
      required: false
  - type: checkboxes
    id: possession
    attributes:
      label: "Do you own this adapter?"
      options:
        - label: "Yes, I have it and can make it available for testing."
          required: false
        - label: "I do not have it; I am suggesting support only."
          required: false
  - type: dropdown
    id: test_help
    attributes:
      label: "Can you help with testing?"
      options:
        - "Yes, I can test it on an Android device."
        - "Yes, I can test RTS/CTS and PTT as well."
        - "I can only provide adapter information."
        - "I cannot perform testing."
    validations:
      required: true
  - type: input
    id: product_link
    attributes:
      label: "Product link (optional)"
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: markings
    attributes:
      label: "Board markings, chip labels, photo or other identifiers"
      description: "Chip markings and connector labels help identify the exact variant. You can attach photos to the issue."
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: "Why would support for this adapter be useful?"
    validations:
      required: false
