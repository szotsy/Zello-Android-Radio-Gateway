name: "FTDI / rádió hardverhiba — FTDI / radio hardware report"
description: "Rádiókapcsolati vagy illesztőprobléma bejelentése / Report a radio connection or interface problem."
title: "[HARDWARE] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: "HU: Ne tegyél közzé privát rádióforgalmat, személyes adatot vagy érzékeny frekvenciát. Feszültség alatt álló berendezést soha ne bonts meg vagy módosíts.\n\nEN: Do not post private radio traffic, personal information or sensitive frequencies. Never open or modify powered equipment."
  - type: input
    id: app_version
    attributes:
      label: "Orfeusz Gateway verzió / Orfeusz Gateway version"
      placeholder: "1.10.62"
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: "Rádió típusa és módosítása / Radio model and modification"
      placeholder: "Baofeng UV-5R / BF-888S; írd le az illesztés módosítását / describe the interface modification"
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: "USB–UART adapter"
      description: "Az ellenőrzött adapter az FTDI FT232R (VID 0403, PID 6001). Más adapterek nincsenek ellenőrizve. / The verified adapter is FTDI FT232R (VID 0403, PID 6001). Other adapters are not verified."
      placeholder: "FTDI FT232R"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: "Android-készülék és verzió / Android device and version"
      placeholder: "Samsung Galaxy S23, Android ..."
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: "Hiba jellege / Symptom"
      options:
        - "Az adapter nem ismerhető fel — Adapter not detected"
        - "USB-engedélyezési / csatlakozási hiba — USB permission / connection problem"
        - "A rádió vétel (RX) nem érzékelhető — Radio receive (RX) not detected"
        - "PTT / adási probléma — PTT / transmit problem"
        - "Hanghiba — Audio problem"
        - "Megszakadó kapcsolat — Intermittent connection"
        - "Egyéb — Other"
    validations:
      required: true
  - type: textarea
    id: wiring
    attributes:
      label: "Bekötés és tápellátás / Wiring and power details"
      description: "Írd le a bekötést, a tápellátást és a csatlakozó tájolását. Ne találgass a lábkiosztással kapcsolatban. / Describe your wiring, power supply and connector orientation. Do not guess pin assignments."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "A hiba előidézésének lépései és tapasztalatok / Reproduction steps and observations"
    validations:
      required: true
