name: "USB–UART kompatibilitási kérelem"
description: "USB–UART adapter kompatibilitásának vizsgálati kérelme az Orfeusz Gateway projekthez."
title: "[USB-UART COMPAT] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Köszönjük, hogy segítesz bővíteni az ellenőrzött USB–UART adapterek körét!

        **Fontos:** a kérelem nem jelenti azt, hogy az adapter már támogatott. A kompatibilitás csak dokumentált teszt és karbantartói ellenőrzés után igazolható. A jelentés soha nem módosítja automatikusan a nyilvános státuszt. Az aktuális státuszokat a [központi kompatibilitási lista](https://szotsy.github.io/Zello-Android-Radio-Gateway/usb-uart-compatibility.html) tartalmazza.

        Ne adj meg személyes adatot, privát rádióforgalmat vagy érzékeny frekvenciát. Feszültség alatt álló berendezést ne bonts meg.
  - type: dropdown
    id: supported_adapter
    attributes:
      label: "Az alkalmazásban támogatott adapter"
      description: "Csak az engine-ben jelenleg engedélyezett adapterek választhatók."
      options:
      # USB_UART_OPTIONS_START
        - "FTDI FT232R / FT232RL"
        - "CH340G"
        - "Silicon Labs CP2102 / CP2102N"
      # USB_UART_OPTIONS_END
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: "Gyártó / márka"
      placeholder: "Adapter gyártója vagy márkája"
    validations:
      required: true
  - type: input
    id: adapter_model
    attributes:
      label: "Adapter típusa / modellje"
      placeholder: "USB–UART adapter modell"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: "USB–UART chip típusa"
      placeholder: "Az adapteren feltüntetett chip / típus"
    validations:
      required: true
  - type: input
    id: vid_pid
    attributes:
      label: "USB VID / PID"
      description: "Ha nem ismert, írd: ismeretlen."
      placeholder: "VID: xxxx, PID: xxxx"
  - type: input
    id: android_device
    attributes:
      label: "Android-eszköz típusa"
      placeholder: "Samsung Galaxy S23"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: "Android-verzió"
      placeholder: "Android-verzió"
    validations:
      required: true
  - type: dropdown
    id: rts_cts
    attributes:
      label: "RTS és CTS kivezetés"
      options:
        - "Mindkettő kivezetve"
        - "Csak RTS"
        - "Csak CTS"
        - "Nem tudom"
    validations:
      required: true
  - type: dropdown
    id: test_level
    attributes:
      label: "Milyen tesztet tudsz vállalni?"
      options:
        - "Csak az adapter felismerését"
        - "RTS és CTS jel ellenőrzését"
        - "PTT vezérlés ellenőrzését"
        - "Teljes rádiós RX/TX tesztet"
        - "Még nincs nálam az adapter"
    validations:
      required: true
  - type: dropdown
    id: usb_detection
    attributes:
      label: "Felismerte az adaptert az Android?"
      options:
        - "Igen"
        - "Nem"
        - "Nem teszteltem"
    validations:
      required: true
  - type: dropdown
    id: rts_result
    attributes:
      label: "RTS jel tesztje"
      options:
        - "Sikeres"
        - "Sikertelen"
        - "Nem teszteltem"
    validations:
      required: true
  - type: dropdown
    id: cts_result
    attributes:
      label: "CTS jel tesztje"
      options:
        - "Sikeres"
        - "Sikertelen"
        - "Nem teszteltem"
    validations:
      required: true
  - type: dropdown
    id: ptt_result
    attributes:
      label: "PTT vezérlés tesztje"
      options:
        - "Sikeres"
        - "Sikertelen"
        - "Nem teszteltem"
    validations:
      required: true
  - type: dropdown
    id: radio_result
    attributes:
      label: "Rádiós RX/TX teszt"
      options:
        - "Sikeres"
        - "Sikertelen"
        - "Nem teszteltem"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Tesztjegyzet és bekötés"
      description: "Írd le a konkrét adapterpanelt, az Android-felismerést, a teszt menetét és eredményeit."
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: "Bizonyíték (opcionális)"
      description: "Az issue létrehozása után csatolj jól látható fotót az adapterpanelről és képernyőképeket a teszteredményekről. Takard ki a személyes adatokat."
